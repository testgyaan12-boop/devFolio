version: '3.8'

services:
  nextjs_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: my_portfolio_app
    restart: unless-stopped
    networks:
      - portfolio-network

  nginx:
    image: nginx:alpine
    container_name: my_portfolio_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped
    depends_on:
      - nextjs_app
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge
